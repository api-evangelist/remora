name: Remora
description: Remora is a carbon-capture startup (legally Echeneidae Inc.) founded in 2020 and based in
  Wixom, Michigan, that retrofits semi-trucks and locomotives with zero-backpressure devices which extract
  and purify up to 90 percent of the CO2 from vehicle exhaust while cutting other pollutants. The company
  then sells the captured, purified carbon dioxide and shares the resulting revenue with the transportation
  operators it partners with. Remora is a hardware and climate-technology business with no public API or
  developer platform; this profile tracks it as an API Evangelist network company for portfolio and
  discovery purposes.
